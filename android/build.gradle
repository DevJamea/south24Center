
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects { p ->
    p.pluginManager.withPlugin("com.android.library") {
        p.android.buildFeatures.buildConfig = true
    }
    // (اختياري) لو في Plugins تطبيقات فرعية، خليه كمان
    p.pluginManager.withPlugin("com.android.application") {
        p.android.buildFeatures.buildConfig = true
    }
}


subprojects { p ->
    if (p.name == "flutter_inappwebview") {
        p.pluginManager.withPlugin("com.android.library") {
            p.android.namespace = "com.pichillilorenzo.flutter_inappwebview"
            p.android.buildFeatures.buildConfig = true
        }
    }
}

subprojects { p ->
    if (p.name == "wakelock") {
        p.pluginManager.withPlugin("com.android.library") {
            p.android.namespace = "com.github.creativecreatorormaybenot.wakelock"
            p.android.buildFeatures.buildConfig = true
        }
    }
}
subprojects { p ->
    p.pluginManager.withPlugin("com.android.library") {
        // 1) Enable BuildConfig if needed (for firebase_analytics and others)
        if (p.android.buildFeatures != null) {
            p.android.buildFeatures.buildConfig = true
        }

        // 2) Fix "Namespace not specified" for AGP 8+
        def ns = null
        try { ns = p.android.namespace } catch (ignored) {}

        if (ns == null || ns.toString().trim().isEmpty()) {
            def manifestFile = p.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def txt = manifestFile.getText("UTF-8")
                def m = (txt =~ /package\s*=\s*"([^"]+)"/)
                if (m.find()) {
                    p.android.namespace = m.group(1)
                }
            }
        }
    }
}
